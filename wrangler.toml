name = "egress-eye-site"
compatibility_date = "2026-10-01"

# Custom domain on the offensivelabs.tech zone (same Cloudflare account).
# Must stay a TOP-LEVEL key — inside [assets] it is silently ignored.
# Requires the deploy token to hold Zone:DNS:Edit for the zone; if a deploy
# fails on this, remove the routes block to ship on *.workers.dev first.
routes = [
  { pattern = "egresseye.offensivelabs.tech", custom_domain = true }
]

# Static site: no build step, no JavaScript, no third-party requests.
[assets]
directory = "./site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
