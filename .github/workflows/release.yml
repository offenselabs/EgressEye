name: Release

# Tag-driven release: runs the full offline test gate, then publishes a
# GitHub release with the compiled dist/ attached as a zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Eval corpus (offline)
        run: npm run eval
      - name: Package dist
        run: |
          cd dist
          zip -qr "../egress-eye-${GITHUB_REF_NAME}-dist.zip" .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "EgressEye $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "egress-eye-${GITHUB_REF_NAME}-dist.zip"
